<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f6f7f9" />
<title>오늘영양</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111318;--muted:#808896;--line:#e9ebef;--green:#29c36a;--green2:#1fad5d;--blue:#4b8bf4;--yellow:#ffb629;--shadow:0 10px 28px rgba(20,24,32,.06)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}body{min-height:100vh}.app{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 16px 112px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:32px;font-weight:850;letter-spacing:-1.5px;line-height:1.1}.date{margin-top:7px;font-size:14px;color:var(--muted)}.today-btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 13px;font-weight:750;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.summary{background:#fff;border-radius:24px;padding:17px;margin-top:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}.ring{width:125px;height:125px;border-radius:50%;background:conic-gradient(var(--blue) 0 32%,#e8ecf2 32% 37%,var(--green) 37% 69%,#e8ecf2 69% 74%,#64cca0 74% 91%,#e8ecf2 91% 100%);display:grid;place-items:center}.ring::before{content:"";width:91px;height:91px;border-radius:50%;background:#fff;position:absolute}.ring-inner{position:relative;text-align:center}.ring-kcal{font-size:28px;font-weight:850;letter-spacing:-1px}.ring-unit{font-size:13px;font-weight:750}.macro{margin:11px 0}.macro-head{display:flex;justify-content:space-between;font-size:13px;font-weight:750;gap:8px}.macro-head span:last-child{white-space:nowrap}.bar{height:8px;border-radius:99px;background:#edf0f4;margin-top:7px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}.cbar{background:var(--blue)}.pbar{background:var(--green)}.fbar{background:var(--yellow)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-title{font-size:18px;font-weight:850}.count{font-size:13px;color:var(--muted)}.food-list{display:flex;flex-direction:column;gap:10px}.food-card{background:#fff;border-radius:19px;padding:13px;box-shadow:var(--shadow);display:grid;grid-template-columns:56px 1fr auto;gap:11px;align-items:center}.food-icon{width:56px;height:56px;border-radius:15px;background:#f4f5f7;display:grid;place-items:center;font-size:34px}.food-name{font-size:16px;font-weight:850}.food-g{font-size:13px;color:var(--muted);margin-top:3px}.food-macros{font-size:12px;color:#69717f;margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}.food-kcal{font-size:14px;font-weight:850;white-space:nowrap}.more{border:0;background:transparent;color:#8b93a0;font-size:20px;padding:4px;display:block;margin-left:auto}.empty{background:#fff;border-radius:20px;padding:28px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:10px;align-items:center;z-index:10}.nav{border:0;background:transparent;color:#7d8592;font-size:11px;font-weight:700;padding:7px 2px}.nav b{display:block;font-size:21px;line-height:1.1;margin-bottom:3px}.nav.active{color:var(--green)}.add-main{border:0;border-radius:16px;background:var(--green);color:#fff;font-weight:850;font-size:16px;padding:15px 10px;box-shadow:0 8px 20px rgba(41,195,106,.25)}
.overlay{position:fixed;inset:0;background:rgba(15,18,24,.35);z-index:30;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(100%,480px);height:min(86vh,760px);background:#fff;border-radius:28px 28px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto;box-shadow:0 -20px 60px rgba(0,0,0,.14)}.sheet-top{display:flex;align-items:center;justify-content:space-between}.close{border:0;background:#f2f4f6;width:38px;height:38px;border-radius:50%;font-size:25px;line-height:1}.sheet-title{font-size:20px;font-weight:850}.ghost{width:38px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:12px 4px;color:#8a919d;font-weight:750;border-bottom:3px solid transparent}.tab.active{color:var(--green);border-color:var(--green)}.search{margin-top:14px;background:#f5f6f8;border-radius:14px;display:flex;align-items:center;padding:0 12px;gap:8px}.search input{border:0;background:transparent;width:100%;padding:13px 0;font-size:15px;outline:0}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0 4px}.chip{border:0;background:#f1f3f5;color:#6d7480;border-radius:999px;padding:9px 13px;font-weight:750;white-space:nowrap}.chip.active{background:#e4f8ec;color:var(--green2)}.pick-list{margin-top:7px;display:flex;flex-direction:column}.pick{display:grid;grid-template-columns:45px 1fr 38px;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #f0f1f3}.pick-icon{width:45px;height:45px;border-radius:13px;background:#f5f6f8;display:grid;place-items:center;font-size:28px}.pick-name{font-size:15px;font-weight:850}.pick-info{font-size:11px;color:#7a8290;margin-top:4px}.plus{border:0;background:#f2f4f6;border-radius:50%;width:34px;height:34px;font-size:22px;color:#555d69}.detail{display:none}.detail.show{display:block}.searchview.hide,.customview.hide{display:none}.qty-wrap{position:sticky;bottom:-18px;background:#fff;border-top:1px solid var(--line);padding:13px 0 0;margin-top:8px}.qty-label{font-size:12px;font-weight:750;color:#5f6672}.qty-row{display:grid;grid-template-columns:1fr auto 1.5fr;gap:9px;align-items:center;margin-top:6px}.qty-row input,.field{width:100%;border:1px solid var(--line);background:#f8f9fb;border-radius:13px;padding:13px;font-size:16px;outline:0}.unit{color:#69717f;font-weight:750}.confirm{border:0;background:var(--green);color:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:850}.detail-card{margin-top:16px;background:#f7f8fa;border-radius:18px;padding:15px}.detail-card h3{margin:0 0 4px}.detail-meta{color:var(--muted);font-size:13px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.stat{background:#fff;border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:15px}.stat span{font-size:10px;color:var(--muted)}.back{border:0;background:transparent;color:var(--green2);font-weight:800;padding:10px 0}.customview{margin-top:14px}.customview label{display:block;font-size:12px;color:#606775;font-weight:800;margin:12px 0 6px}.custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.savecustom{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--green);color:#fff;padding:14px;font-size:16px;font-weight:850}
@media(max-width:390px){.summary{grid-template-columns:112px 1fr}.ring{width:106px;height:106px}.ring::before{width:76px;height:76px}.ring-kcal{font-size:24px}.macro-head{font-size:12px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><div class="title">오늘의 식단</div><div class="date" id="dateText"></div></div><button class="today-btn">▣ 오늘</button></div>
  <section class="summary">
    <div class="ring"><div class="ring-inner"><div class="ring-kcal" id="totalKcal">0</div><div class="ring-unit">kcal</div></div></div>
    <div>
      <div class="macro"><div class="macro-head"><span>탄수화물 <small>(순탄수)</small></span><span><b id="totalCarb">0</b> / 350 g</span></div><div class="bar"><i class="cbar" id="carbBar"></i></div></div>
      <div class="macro"><div class="macro-head"><span>단백질</span><span><b id="totalProtein">0</b> / 180 g</span></div><div class="bar"><i class="pbar" id="proteinBar"></i></div></div>
      <div class="macro"><div class="macro-head"><span>지방</span><span><b id="totalFat">0</b> / 70 g</span></div><div class="bar"><i class="fbar" id="fatBar"></i></div></div>
    </div>
  </section>
  <div class="section-head"><div class="section-title">먹은 음식</div><div class="count" id="countText">0개</div></div>
  <section class="food-list" id="foodList"></section>
</main>
<nav class="bottom"><button class="nav active"><b>🍴</b>오늘 기록</button><button class="add-main" id="openAdd">＋ 음식 추가하기</button><button class="nav"><b>⌕</b>음식 찾기</button></nav>

<div class="overlay" id="overlay">
  <section class="sheet">
    <div class="sheet-top"><button class="close" id="closeBtn">×</button><div class="sheet-title">음식 추가하기</div><div class="ghost"></div></div>
    <div class="tabs"><button class="tab active" data-tab="search">검색하기</button><button class="tab" data-tab="recent">자주 먹는 음식</button><button class="tab" data-tab="custom">직접 입력</button></div>
    <div id="searchView" class="searchview">
      <div class="search">⌕ <input id="searchInput" placeholder="음식을 검색하세요 (예: 밥, 닭가슴살, 계란)"></div>
      <div class="chips"><button class="chip active">전체</button><button class="chip">밥/곡류</button><button class="chip">육류</button><button class="chip">달걀/유제품</button><button class="chip">채소</button><button class="chip">과일</button></div>
      <div class="pick-list" id="pickList"></div>
    </div>
    <div id="detailView" class="detail">
      <button class="back" id="backBtn">← 음식 목록</button>
      <div class="detail-card"><h3 id="detailName"></h3><div class="detail-meta">100g 기준</div><div class="detail-grid"><div class="stat"><b id="dc"></b><span>순탄수</span></div><div class="stat"><b id="dp"></b><span>단백질</span></div><div class="stat"><b id="df"></b><span>지방</span></div><div class="stat"><b id="dk"></b><span>kcal</span></div></div></div>
      <div class="qty-wrap"><div class="qty-label">섭취량</div><div class="qty-row"><input id="grams" type="number" inputmode="decimal" value="210"><div class="unit">g</div><button class="confirm" id="confirmAdd">추가하기</button></div></div>
    </div>
    <div id="customView" class="customview hide">
      <label>음식 이름</label><input class="field" id="customName" placeholder="예: 연어구이">
      <div class="custom-grid"><div><label>100g당 순탄수(g)</label><input class="field" id="customCarb" type="number" value="0"></div><div><label>100g당 단백질(g)</label><input class="field" id="customProtein" type="number" value="0"></div><div><label>100g당 지방(g)</label><input class="field" id="customFat" type="number" value="0"></div><div><label>섭취량(g)</label><input class="field" id="customGrams" type="number" value="100"></div></div>
      <button class="savecustom" id="saveCustom">추가하기</button>
    </div>
  </section>
</div>
<script>
const foods=[
{id:'rice',name:'흰쌀밥',icon:'🍚',carb:28.0,protein:2.6,fat:.3,cat:'밥/곡류'},
{id:'brownrice',name:'현미밥',icon:'🍚',carb:23.2,protein:2.8,fat:1.0,cat:'밥/곡류'},
{id:'chicken',name:'닭가슴살 (생)',icon:'🍗',carb:0,protein:23.0,fat:2.0,cat:'육류'},
{id:'egg',name:'계란 (삶은 것)',icon:'🥚',carb:1.1,protein:12.6,fat:10.6,cat:'달걀/유제품'},
{id:'sweetpotato',name:'고구마',icon:'🍠',carb:21.8,protein:1.8,fat:.2,cat:'밥/곡류'},
{id:'banana',name:'바나나',icon:'🍌',carb:22.8,protein:1.1,fat:.3,cat:'과일'},
{id:'milk',name:'우유 (일반)',icon:'🥛',carb:4.8,protein:3.2,fat:3.3,cat:'달걀/유제품'},
{id:'beef',name:'소고기 우둔살',icon:'🥩',carb:0,protein:21.3,fat:5.0,cat:'육류'},
{id:'oats',name:'오트밀',icon:'🥣',carb:56.1,protein:13.2,fat:6.5,cat:'밥/곡류'}];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const goals={c:350,p:180,f:70};let entries=[];try{entries=JSON.parse(localStorage.getItem('nutrition-v3')||'[]')}catch(e){}let selected=null;const r=n=>Math.round(n*10)/10;
$('#dateText').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
function nutrition(food,g){let m=g/100,c=food.carb*m,p=food.protein*m,f=food.fat*m;return{carb:r(c),protein:r(p),fat:r(f),kcal:Math.round(c*4+p*4+f*9)}}
function save(){localStorage.setItem('nutrition-v3',JSON.stringify(entries))}
function render(){const list=$('#foodList');list.innerHTML='';if(!entries.length)list.innerHTML='<div class="empty">아직 기록된 음식이 없어요.<br>아래 버튼으로 첫 음식을 추가해보세요.</div>';entries.forEach((e,i)=>{const el=document.createElement('div');el.className='food-card';el.innerHTML=`<div class="food-icon">${e.icon||'🍽️'}</div><div><div class="food-name">${e.name}</div><div class="food-g">${e.grams} g</div><div class="food-macros"><span>탄 ${e.carb}g</span><span>단 ${e.protein}g</span><span>지 ${e.fat}g</span></div></div><div><div class="food-kcal">${e.kcal} kcal</div><button class="more" data-i="${i}">×</button></div>`;list.appendChild(el)});$$('.more').forEach(b=>b.onclick=()=>{entries.splice(+b.dataset.i,1);save();render()});let t=entries.reduce((a,e)=>({c:a.c+e.carb,p:a.p+e.protein,f:a.f+e.fat,k:a.k+e.kcal}),{c:0,p:0,f:0,k:0});$('#totalCarb').textContent=r(t.c);$('#totalProtein').textContent=r(t.p);$('#totalFat').textContent=r(t.f);$('#totalKcal').textContent=Math.round(t.k).toLocaleString();$('#carbBar').style.width=Math.min(100,t.c/goals.c*100)+'%';$('#proteinBar').style.width=Math.min(100,t.p/goals.p*100)+'%';$('#fatBar').style.width=Math.min(100,t.f/goals.f*100)+'%';$('#countText').textContent=entries.length+'개'}
function renderPicks(q=''){const box=$('#pickList');let data=foods.filter(f=>f.name.toLowerCase().includes(q.toLowerCase()));box.innerHTML=data.map(f=>`<div class="pick"><div class="pick-icon">${f.icon}</div><div><div class="pick-name">${f.name}</div><div class="pick-info">100g 기준　탄 ${f.carb}g　단 ${f.protein}g　지 ${f.fat}g　${nutrition(f,100).kcal} kcal</div></div><button class="plus" data-id="${f.id}">＋</button></div>`).join('');$$('.plus').forEach(b=>b.onclick=()=>openDetail(foods.find(f=>f.id===b.dataset.id)))}
function openDetail(f){selected=f;$('#searchView').classList.add('hide');$('#detailView').classList.add('show');$('#detailName').textContent=f.name;$('#dc').textContent=f.carb+'g';$('#dp').textContent=f.protein+'g';$('#df').textContent=f.fat+'g';$('#dk').textContent=nutrition(f,100).kcal}
function closeDetail(){$('#detailView').classList.remove('show');$('#searchView').classList.remove('hide');selected=null}
function openSheet(){$('#overlay').classList.add('show');document.body.style.overflow='hidden'}function closeSheet(){$('#overlay').classList.remove('show');document.body.style.overflow='';closeDetail()}
$('#openAdd').onclick=openSheet;$('.nav:last-child').onclick=openSheet;$('#closeBtn').onclick=closeSheet;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()};$('#backBtn').onclick=closeDetail;$('#searchInput').oninput=e=>renderPicks(e.target.value);
$('#confirmAdd').onclick=()=>{if(!selected)return;let g=+$('#grams').value||0;if(g<=0)return alert('섭취량을 입력해주세요.');entries.unshift({name:selected.name,icon:selected.icon,grams:g,...nutrition(selected,g)});save();render();closeSheet()};
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');closeDetail();let tab=t.dataset.tab;$('#searchView').classList.toggle('hide',tab==='custom');$('#customView').classList.toggle('hide',tab!=='custom');if(tab==='recent'){let used=[...new Set(entries.map(e=>e.name))];renderPicks('');if(used.length){let subset=foods.filter(f=>used.includes(f.name));if(subset.length){const box=$('#pickList');box.innerHTML=subset.map(f=>`<div class="pick"><div class="pick-icon">${f.icon}</div><div><div class="pick-name">${f.name}</div><div class="pick-info">100g 기준　탄 ${f.carb}g　단 ${f.protein}g　지 ${f.fat}g</div></div><button class="plus" data-id="${f.id}">＋</button></div>`).join('');$$('.plus').forEach(b=>b.onclick=()=>openDetail(foods.find(f=>f.id===b.dataset.id)))}}}else if(tab==='search')renderPicks($('#searchInput').value)});
$('#saveCustom').onclick=()=>{let name=$('#customName').value.trim(),g=+$('#customGrams').value||0;if(!name||g<=0)return alert('음식 이름과 섭취량을 입력해주세요.');let f={name,icon:'🍽️',carb:+$('#customCarb').value||0,protein:+$('#customProtein').value||0,fat:+$('#customFat').value||0};entries.unshift({name,icon:'🍽️',grams:g,...nutrition(f,g)});save();render();closeSheet()};
renderPicks();render();
</script>
</body>
</html>
